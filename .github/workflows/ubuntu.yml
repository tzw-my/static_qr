# Try out x-cmd usage in GitHub Actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  x-cmd-demo:
    runs-on: macos-latest
    steps:
      - name: Install x-cmd
        uses: x-cmd-action/x-cmd@v1

      - name: Demo
        run: |
          # 方式一: source 后作为 shell 函数使用
          . ~/.x-cmd.root/X
          x version

          # 一些模块演示
          x cowsay "hello from x-cmd"
          x pkg ls jq

          # 方式二: 直接作为外部命令使用
          x-cmd cowsay "one-liner"
