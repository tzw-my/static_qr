# 评论/新 Issue 提到 @x 时自动加 reaction + 回复
name: reply
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  reply:
    runs-on: ubuntu-latest
    permissions: { issues: write, pull-requests: write }   # PR 评论需要 pull-requests: write, 否则 403
    concurrency: { group: ai-reply, cancel-in-progress: false }
    steps:
      - uses: x-cmd-action/ai/reply@v1
        with:
          keyword: '@x'           # 词边界匹配, 不会误触 @x-cmd
          reaction: eyes
          comment: '👀 on it'
          # use_ai: 'true'        # 改用 AI 生成回复 (需 API key)
          # prompt: '请用中文回复'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}   # 仅 use_ai: 'true' 时需要
