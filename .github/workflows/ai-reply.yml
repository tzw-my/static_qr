# 评论提及 @x 时自动加 reaction + 回复 (不需要 AI key)
name: AI Reply

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: reply-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: x-cmd-action/ai/reply@v1
        with:
          keyword: '@x'
          reaction: eyes
          comment: '👀 on it'
